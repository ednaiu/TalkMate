<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalkMate: администрирование</title>
<style>
  :root { --pink:#FFD9E8; --pink-line:#FFDCEB; --blue:#8C9EF2; --ink:#1b1b1f; --grey:#8a8a92; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--pink); }
  header { display:flex; align-items:center; gap:16px; padding:20px 24px; }
  header h1 { margin:0; font-size:22px; flex:1; }
  main { background:#fff; border-radius:36px 36px 0 0; min-height:calc(100vh - 76px); padding:24px; }
  .wrap { max-width:880px; margin:0 auto; }
  nav { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  button { font:inherit; border:1.5px solid var(--blue); background:#fff; color:var(--blue); border-radius:999px; padding:8px 20px; cursor:pointer; }
  button.primary, nav button.on { background:var(--blue); color:#fff; }
  button.danger { border-color:#e58aa8; color:#c9406e; }
  input, textarea { font:inherit; width:100%; border:1.5px solid #cfd6fb; border-radius:18px; padding:9px 16px; margin:4px 0 12px; }
  textarea { min-height:180px; border-radius:18px; resize:vertical; }
  label { color:var(--grey); font-size:13px; }
  .card { border:1.5px solid var(--pink-line); border-radius:24px; padding:16px 20px; margin-bottom:14px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .row > .grow { flex:1; min-width:180px; }
  .msg { min-height:22px; color:#c9406e; margin:8px 0; }
  .msg.ok { color:#3c8d5a; }
  .hint { color:var(--grey); font-size:13px; }
  [hidden] { display:none !important; }
  #login { max-width:360px; margin:40px auto; }
</style>
</head>
<body>
<header>
  <h1>TalkMate · администрирование</h1>
  <span id="who" class="hint"></span>
  <button id="logout" hidden>Выйти</button>
</header>
<main><div class="wrap">

<section id="login">
  <label>Email<input id="email" type="email" autocomplete="username"></label>
  <label>Пароль<input id="password" type="password" autocomplete="current-password"></label>
  <button class="primary" id="loginBtn">Войти</button>
  <div class="msg" id="loginMsg"></div>
</section>

<section id="panel" hidden>
  <nav>
    <button data-tab="articles" class="on">Статьи</button>
    <button data-tab="thresholds">Пороговые значения</button>
    <button data-tab="users">Пользователи</button>
  </nav>
  <div class="msg" id="msg"></div>

  <div id="articles">
    <div class="card">
      <b id="formTitle">Новая статья</b>
      <label>Заголовок<input id="aTitle"></label>
      <label>Текст (фрагмент между ** и ** будет выделен жирным)<textarea id="aContent"></textarea></label>
      <div class="row">
        <button class="primary" id="aSave">Добавить статью</button>
        <button id="aCancel" hidden>Отменить</button>
      </div>
    </div>
    <div id="aList"></div>
  </div>

  <div id="thresholds" hidden>
    <div class="card" id="tForm"></div>
    <button class="primary" id="tSave">Сохранить пороги</button>
    <button id="tReset">Вернуть значения по умолчанию</button>
  </div>

  <div id="users" hidden><div id="uList"></div></div>
</section>

</div></main>
<script>
const $ = id => document.getElementById(id);
let token = sessionStorage.getItem("tm_token") || "";
let editingId = null;
let defaults = {};

async function api(method, path, body) {
  const res = await fetch("/api" + path, {
    method,
    headers: Object.assign({"Content-Type": "application/json"}, token ? {Authorization: "Bearer " + token} : {}),
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && data.message) || "Ошибка " + res.status);
  return data;
}
function say(text, ok) { $("msg").textContent = text; $("msg").className = "msg" + (ok ? " ok" : ""); }
function el(tag, props, children) {
  const node = Object.assign(document.createElement(tag), props || {});
  (children || []).forEach(c => node.append(c));
  return node;
}
async function guard(fn, okText) {
  try { await fn(); if (okText) say(okText, true); } catch (e) { say(e.message); }
}

async function start() {
  try {
    const me = await api("GET", "/me");
    if (me.role !== "admin") throw new Error("Нужны права администратора");
    $("who").textContent = me.name + " · " + me.email;
    $("login").hidden = true; $("panel").hidden = false; $("logout").hidden = false;
    await Promise.all([loadArticles(), loadThresholds(), loadUsers()]);
  } catch (e) {
    token = ""; sessionStorage.removeItem("tm_token");
    $("login").hidden = false; $("panel").hidden = true; $("logout").hidden = true; $("who").textContent = "";
    return e;
  }
}
$("loginBtn").onclick = async () => {
  $("loginMsg").textContent = "";
  try {
    const data = await api("POST", "/auth/login", {email: $("email").value, password: $("password").value});
    token = data.token; sessionStorage.setItem("tm_token", token);
    const err = await start();
    if (err) $("loginMsg").textContent = err.message;
  } catch (e) { $("loginMsg").textContent = e.message; }
};
$("logout").onclick = () => { token = ""; sessionStorage.removeItem("tm_token"); start(); };
document.querySelectorAll("nav button").forEach(btn => btn.onclick = () => {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b === btn));
  ["articles", "thresholds", "users"].forEach(id => $(id).hidden = id !== btn.dataset.tab);
  say("");
});

// Статьи
function resetForm() {
  editingId = null; $("aTitle").value = ""; $("aContent").value = "";
  $("formTitle").textContent = "Новая статья"; $("aSave").textContent = "Добавить статью"; $("aCancel").hidden = true;
}
async function loadArticles() {
  const list = await api("GET", "/admin/articles");
  $("aList").replaceChildren(...list.map(a => el("div", {className: "card"}, [
    el("div", {className: "row"}, [
      el("b", {className: "grow", textContent: a.title}),
      el("button", {textContent: "Изменить", onclick: () => {
        editingId = a.id; $("aTitle").value = a.title; $("aContent").value = a.content;
        $("formTitle").textContent = "Редактирование статьи"; $("aSave").textContent = "Сохранить"; $("aCancel").hidden = false;
        window.scrollTo({top: 0, behavior: "smooth"});
      }}),
      el("button", {className: "danger", textContent: "Удалить", onclick: () => {
        if (confirm("Удалить статью «" + a.title + "»?"))
          guard(async () => { await api("DELETE", "/admin/articles/" + a.id); if (editingId === a.id) resetForm(); await loadArticles(); }, "Статья удалена");
      }}),
    ]),
    el("div", {className: "hint", textContent: a.content.slice(0, 160) + (a.content.length > 160 ? "…" : "")}),
  ])));
}
$("aSave").onclick = () => guard(async () => {
  const body = {title: $("aTitle").value, content: $("aContent").value};
  if (editingId) await api("PUT", "/admin/articles/" + editingId, body); else await api("POST", "/admin/articles", body);
  resetForm(); await loadArticles();
}, "Статья сохранена");
$("aCancel").onclick = resetForm;

// Пороги
function fillThresholds(values, labels) {
  $("tForm").replaceChildren(...Object.keys(values).map(key => el("label", {}, [
    labels[key] || key, el("input", {type: "number", step: "any", value: values[key], id: "t_" + key}),
  ])));
}
let labels = {};
async function loadThresholds() {
  const data = await api("GET", "/admin/thresholds");
  defaults = data.defaults; labels = data.labels; fillThresholds(data.values, labels);
}
function readThresholds() {
  const body = {};
  Object.keys(defaults).forEach(key => body[key] = Number($("t_" + key).value));
  return body;
}
$("tSave").onclick = () => guard(async () => { await api("PUT", "/admin/thresholds", readThresholds()); }, "Пороги сохранены");
$("tReset").onclick = () => guard(async () => { await api("PUT", "/admin/thresholds", defaults); fillThresholds(defaults, labels); }, "Возвращены значения по умолчанию");

// Пользователи
async function loadUsers() {
  const list = await api("GET", "/admin/users");
  $("uList").replaceChildren(...list.map(u => {
    const name = el("input", {value: u.name}), email = el("input", {value: u.email, type: "email"});
    return el("div", {className: "card"}, [
      el("div", {className: "row"}, [
        el("label", {className: "grow"}, ["Имя", name]),
        el("label", {className: "grow"}, ["Email", email]),
        el("button", {className: "primary", textContent: "Сохранить", onclick: () =>
          guard(async () => { await api("PATCH", "/admin/users/" + u.id, {name: name.value, email: email.value}); await loadUsers(); }, "Данные пользователя сохранены")}),
      ]),
      el("div", {className: "hint", textContent: (u.role === "admin" ? "Администратор" : "Пользователь") + " · зарегистрирован " + u.created_at.slice(0, 10)}),
    ]);
  }));
}

if (token) start();
</script>
</body>
</html>
