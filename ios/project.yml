name: TalkMate
options:
  bundleIdPrefix: ru.itmo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    # Для телефона адрес сервера подставляет install_on_iphone.sh: localhost на телефоне указывает на сам телефон.
    TALKMATE_SERVER_URL: http://localhost:5050
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  TalkMate:
    type: application
    platform: iOS
    sources: [TalkMate]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.itmo.talkmate
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: TalkMate/Info.plist
      properties:
        CFBundleDisplayName: TalkMate
        UILaunchScreen:
          UIColorName: Pink
        UIAppFonts: [YesevaOne-Regular.ttf, PoiretOne-Regular.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Микрофон нужен, чтобы записать ваше выступление и оценить речь.
        # Сервер разработки работает по HTTP в локальной сети. Для боевого сервера с HTTPS исключение нужно убрать.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Адрес сервера по умолчанию. В симуляторе localhost указывает на компьютер разработчика.
        TalkMateServerURL: $(TALKMATE_SERVER_URL)
        NSLocalNetworkUsageDescription: Приложение обращается к серверу TalkMate в вашей локальной сети.
  TalkMateTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TalkMateTests]
    dependencies:
      - target: TalkMate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TalkMateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TalkMateUITests]
    dependencies:
      - target: TalkMate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TalkMate:
    build:
      targets:
        TalkMate: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [TalkMateTests, TalkMateUITests]
